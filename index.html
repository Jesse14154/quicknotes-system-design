
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - System Design</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1>QuickNotes</h1>
    <p>Your ideas, stored in one place.</p>
  </header>

  <main>
    <section class="panel">
      <h2>Load your notes</h2>
      <p>Retrieve sample notes from the practice API.</p>

      <button type="button" id="load-btn">Load notes</button>

      <p id="status" role="status" aria-live="polite"></p>

      <ul id="notes-list" aria-label="Notes list"></ul>
    </section>

    <section class="panel">
      <h2>Create a note</h2>

      <form id="note-form">
        <label for="title-input">Title</label>
        <input
          type="text"
          id="title-input"
          name="title"
          maxlength="100"
          required
        >

        <label for="body-input">Note body (optional)</label>
        <textarea
          id="body-input"
          name="body"
          rows="4"
        ></textarea>

        <button type="submit" id="submit-btn">Create note</button>
      </form>
    </section>
  </main>

  <footer>
    <p>QuickNotes System Design Project</p>
  </footer>
</body>
</html>
